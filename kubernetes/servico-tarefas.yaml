apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-tarefas
  labels:
    app: servico-tarefas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servico-tarefas
  template:
    metadata:
      labels:
        app: servico-tarefas
    spec:
      containers:
      - name: servico-tarefas
        image: servico-tarefas:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5003
        env:
        - name: BD_HOST
          value: mariadb
        - name: BD_UTILIZADOR
          value: root
        - name: BD_SENHA
          valueFrom:
            secretKeyRef:
              name: app-segredos
              key: mysql-root-password
        - name: BD_NOME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mysql-database
---
apiVersion: v1
kind: Service
metadata:
  name: servico-tarefas
spec:
  selector:
    app: servico-tarefas
  ports:
  - port: 5003
    targetPort: 5003
  type: ClusterIP
